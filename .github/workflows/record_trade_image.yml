name: AI截图校验入库

on:
  workflow_dispatch:
    inputs:
      trade_json:
        description: "CF视觉模型输出的结构化JSON（不含原图）"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fund-notion-trade-import
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: pip install 'requests>=2.31.0' 'jsonschema>=4.23.0,<5'
      - name: 校验并写入Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: "25bf49a100364b528fcf8c84077c338a"
          NOTION_TRADES_DATABASE_ID: "b7a9b06a-b7db-43f0-b825-aa8e61af1285"
        run: python record_trade_from_image.py --event-file "$GITHUB_EVENT_PATH"
